# GitHub Actions workflow: deploy static site infrastructure + content.
# - Runs Terraform against AWS to provision/update S3 + CloudFront.
# - Then invalidates CloudFront so updated HTML is served immediately.
# Note: This repo currently has TWO workflow files:
# - `.github/workflows/deploy.yml`
# - `.github\workflows\deploy.yml`
# Git treats them as different paths on Windows, but GitHub Actions only reads
# `.github/workflows/*` in the repo. Consider deleting this duplicate.
name: Deploy Static Website


on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Terraform Apply + CloudFront Invalidation
    runs-on: ubuntu-latest

    env:
      # AWS credentials are provided via repo/environment secrets.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-2

      # Terraform variable injection (maps to var.bucket_name).
      TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set Up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.0"
        
      - name: Terraform init
        run: terraform init
        
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Invalidate CloudFront Cache
        run: |
          # Read the distribution id from Terraform outputs (created in `output.tf`).
          DISTRIBUTION_ID="$(terraform output -raw aws_cloudfront_distribution_id)"
          echo "Invalidating CloudFront distribution: ${DISTRIBUTION_ID}"

          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"

          echo "Cache invalidation submitted - changes should be visible shortly."
        
        
        