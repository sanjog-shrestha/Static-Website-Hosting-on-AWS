# -----------------------------------------------------------------------------
# Destroy Workflow — Tears down all Terraform-managed infrastructure
#
# This workflow is MANUAL ONLY — it can only be triggered from the
# GitHub Actions tab. It will never run automatically on a push.
#
# Required GitHub Secrets (same as deploy.yml):
#   AWS_ACCESS_KEY_ID       — IAM user access key
#   AWS_SECRET_ACCESS_KEY   — IAM user secret key
#   TF_VAR_BUCKET_NAME      — globally unique S3 bucket name
# -----------------------------------------------------------------------------

name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm you want to tear down all infrastructure"
        required: true

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    eu-west-2
      TF_VAR_bucket_name:    ${{ secrets.TF_VAR_BUCKET_NAME }}

    steps:

      # ── 1. Validate the confirmation input ──────────────────────────────────
      - name: Confirm destroy intent
        if: ${{ github.event.inputs.confirm_destroy != 'DESTROY' }}
        run: |
          echo "Confirmation input was not DESTROY — aborting."
          exit 1

      # ── 2. Checkout repository ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 3. Set up Terraform ─────────────────────────────────────────────────
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.0"

      # ── 4. Initialise Terraform ─────────────────────────────────────────────
      - name: Terraform Init
        run: terraform init

      # ── 5. Empty the S3 bucket before destroy ───────────────────────────────
      # S3 buckets with versioning enabled cannot be deleted unless empty.
      # This step removes all object versions and delete markers first.
      - name: Empty S3 bucket
        run: |
          BUCKET="${{ secrets.TF_VAR_BUCKET_NAME }}"
          echo "Emptying bucket: $BUCKET"

          # Delete all object versions
          aws s3api list-object-versions --bucket "$BUCKET" \
            --query 'Versions[].{Key:Key,VersionId:VersionId}' \
            --output json | \
          jq -r '.[] | "\(.Key) \(.VersionId)"' | \
          while read key version; do
            aws s3api delete-object --bucket "$BUCKET" --key "$key" --version-id "$version"
          done

          # Delete all delete markers
          aws s3api list-object-versions --bucket "$BUCKET" \
            --query 'DeleteMarkers[].{Key:Key,VersionId:VersionId}' \
            --output json | \
          jq -r '.[] | "\(.Key) \(.VersionId)"' | \
          while read key version; do
            aws s3api delete-object --bucket "$BUCKET" --key "$key" --version-id "$version"
          done

          echo "Bucket emptied successfully"

      # ── 6. Destroy all infrastructure ───────────────────────────────────────
      - name: Terraform Destroy
        run: terraform destroy -auto-approve
